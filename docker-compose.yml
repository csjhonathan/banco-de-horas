# MongoDB local para desenvolvimento (opcional — dá pra usar o Atlas no lugar,
# é só apontar a MONGO_URI). O app roda com `npm run dev` (não em container).
#   docker compose up -d mongo   (ou: make mongo)
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
